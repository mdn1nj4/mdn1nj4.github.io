<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAKI 🌙</title>

<style>

body{
    margin:0;
    background:#000;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:monospace;
}

/* nice glowing text */
#glitchText{
    font-size:clamp(40px,15vw,110px);
    font-weight:bold;
    text-align:center;
    letter-spacing:0.08em;
    color:#00eaff;

    text-shadow:
        0 0 10px #00eaff,
        0 0 20px #00eaff,
        0 0 40px #00eaff,
        0 0 80px #00eaff;

    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow{
    from{
        text-shadow:
            0 0 10px #00eaff,
            0 0 20px #00eaff,
            0 0 40px #00eaff;
    }

    to{
        text-shadow:
            0 0 20px #00eaff,
            0 0 40px #00eaff,
            0 0 80px #00eaff;
    }
}

</style>

</head>

<body>

<div id="glitchText"></div>

<script>

const names = [
"ZAKIII ❤️",
"ZAKIRA 🌙",
"MOON 🌙",
"PAAGAL 😡",
"SORRY 😕",
"I LOVE YOU 💙"
];

const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
const el = document.getElementById("glitchText");

let nameIndex = 0;

function randomString(length){
    let result="";
    for(let i=0;i<length;i++){
        result += chars[Math.floor(Math.random()*chars.length)];
    }
    return result;
}

function runGlitch(){

    const name = names[nameIndex];
    let count = 0;

    const glitchInterval = setInterval(()=>{

        el.textContent = randomString(name.length);
        count++;

        if(count > 25){

            clearInterval(glitchInterval);
            el.textContent = name;

            nameIndex = (nameIndex + 1) % names.length;

            setTimeout(runGlitch,1200);

        }

    },40);

}

runGlitch();

</script>

</body>
</html>
