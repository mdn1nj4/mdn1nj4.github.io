<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAKI 🌙</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-family:monospace;
color:white;
overflow:hidden;
background:black;
}

/* floating hearts */

.heart{
position:absolute;
pointer-events:none;
color:white;
opacity:0.9;
animation:float 6s linear forwards;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(0.7);
opacity:0;
}
10%{
opacity:1;
}
100%{
transform:translateY(-10vh) scale(1.3);
opacity:0;
}
}

/* glitch text */

#glitchText{
font-size:clamp(40px,12vw,90px);
font-weight:bold;
text-align:center;
letter-spacing:0.1em;
color:white;

text-shadow:
0 0 10px rgba(255,255,255,0.8),
0 0 30px rgba(255,255,255,0.6);

animation:floatText 4s ease-in-out infinite;
}

@keyframes floatText{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}

/* countdown */

.countdown-box{
position:absolute;
bottom:40px;

padding:20px 40px;
border-radius:20px;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);

border:1px solid rgba(255,255,255,0.2);

box-shadow:0 10px 40px rgba(0,0,0,0.5);

text-align:center;
}

#label{
font-size:18px;
margin-bottom:10px;
letter-spacing:2px;
}

#countdown{
font-size:clamp(22px,5vw,36px);
font-weight:bold;
letter-spacing:3px;
}

</style>

</head>

<body>

<div id="glitchText"></div>

<div class="countdown-box">
<div id="label">🚆 For Train</div>
<div id="countdown"></div>
</div>

<script>

/* white hearts */

const heartSymbols=["♡","♥","❤"];

function createHeart(){

let heart=document.createElement("div");
heart.className="heart";
heart.innerText=heartSymbols[Math.floor(Math.random()*heartSymbols.length)];

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(14+Math.random()*22)+"px";

document.body.appendChild(heart);

setTimeout(()=>{heart.remove()},6000);

}

/* spawn hearts faster */

setInterval(createHeart,250);

/* glitch messages */

const names=[
"ZAKIII ❤️",
"MOON 🌙",
"PAAGAL 😡",
"SORRY 😕",
"Don't Get Mad At Me 💙",
"💙 I LOVE YOU 💙"
];

const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
const el=document.getElementById("glitchText");

let nameIndex=0;

function randomString(length){
let result="";
for(let i=0;i<length;i++){
result+=chars[Math.floor(Math.random()*chars.length)];
}
return result;
}

function runGlitch(){

const name=names[nameIndex];
let count=0;

const interval=setInterval(()=>{

el.textContent=randomString(name.length);
count++;

if(count>20){

clearInterval(interval);
el.textContent=name;

nameIndex=(nameIndex+1)%names.length;

setTimeout(runGlitch,1500);

}

},40);

}

runGlitch();

/* countdown */

const targetDate=new Date("March 18, 2026 10:55:00").getTime();
const countdownEl=document.getElementById("countdown");

setInterval(()=>{

const now=new Date().getTime();
const distance=targetDate-now;

const days=Math.floor(distance/(1000*60*60*24));
const hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
const minutes=Math.floor((distance%(1000*60*60))/(1000*60));
const seconds=Math.floor((distance%(1000*60))/1000);

countdownEl.textContent=
days+"d "+
hours+"h "+
minutes+"m "+
seconds+"s left";

if(distance<0){
countdownEl.textContent="🚆 Train Time ❤️";
}

},1000);

</script>

</body>
</html>
